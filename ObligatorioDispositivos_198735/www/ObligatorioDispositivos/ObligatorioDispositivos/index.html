<!DOCTYPE html>
<html lang="es">

<head>
    <link rel="icon" href="data:,">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APP Actividades</title>
    <script type="module" src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.esm.js"></script>
    <script nomodule src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@ionic/core/css/ionic.bundle.css" />
</head>

<body>
    <ion-app>
        <ion-router id="ruteo">
            <ion-route url="/" component="page-home"></ion-route>
            <ion-route url="/login" component="page-login"></ion-route>
            <ion-route url="/usuarios" component="page-registro"></ion-route>
            <ion-route url="/actividades" component="page-actividades"></ion-route>
            <ion-route url="/registro-actividad" component="page-registro-actividad"></ion-route>
        </ion-router>
        <ion-nav id="nav"></ion-nav>

        <ion-menu content-id="main" id="menu">
            <ion-header>
                <ion-toolbar color="primary">
                    <ion-title>App de actividades</ion-title>
                </ion-toolbar>
            </ion-header>
            <ion-content class="ion-padding">
                <ion-list>

                    <ion-item href="/login" onclick="cerrarMenu()" id="btnMenuLogin">Login</ion-item>
                    <ion-item href="/usuarios" onclick="cerrarMenu()" id="btnMenuRegistro">Registro</ion-item>
                    <ion-item href="/actividades" onclick="cerrarMenu()"
                        id="btnMenuListadoActividades">Actividades</ion-item>
                    <ion-item href="/registro-actividad" onclick="cerrarMenu()" id="btnMenuRegistroActividad">Registra
                        tu
                        Actividad</ion-item>
                    <ion-item onclick="cerrarSesion()" id="btnMenuCerrarSesion">Cerrar Sesión</ion-item>
                </ion-list>
            </ion-content>
        </ion-menu>
        <div id="main"></div>

        <page-home class="ion-page" id="home">
        </page-home>

        <!--Pantalla de login-->
        <page-login class="ion-page" id="pantalla-login">
            <ion-header>
                <ion-toolbar color="secondary">
                    <ion-buttons>
                        <ion-menu-button></ion-menu-button>
                    </ion-buttons>
                    <ion-title>Login</ion-title>
                </ion-toolbar>
            </ion-header>
            <ion-content class="ion-padding">
                <label for="txtLoginEmail">Email</label>
                <input type="email" id="txtLoginEmail">
                <br>
                <label for="txtLoginPassword">Contraseña</label>
                <input type="password" id="txtLoginPassword">
                <br><br>
                <ion-button fill="outline" id="btnLoginIngresar">Ingresar</ion-button>
                <br><br>
                <p id="pLoginMensajes"></p>
            </ion-content>
        </page-login>

        <!--Pantalla de registro-->
        <page-registro class="ion-page" id="pantalla-registro">
            <ion-header>
                <ion-toolbar color="success">
                    <ion-buttons>
                        <ion-menu-button></ion-menu-button>
                    </ion-buttons>
                    <ion-title>Registro</ion-title>
                </ion-toolbar>
            </ion-header>

            <ion-content class="ion-padding">
                <label for="txtRegistroEmail">Email</label>
                <input type="text" id="txtRegistroEmail">
                <br><br>
                <label for="txtRegistroPassword">Contraseña</label>
                <input type="password" id="txtRegistroPassword">
                <br><br>
                <label for="txtRegistroPais">País de Residencia</label>
                <input type="number" id="txtRegistroPais">
                <br><br>
                <ion-button fill="outline" id="btnRegistroRegistrarse">Ingresar</ion-button>
                <br><br>

                <p id="pRegistroMensajes"></p>
            </ion-content>

        </page-registro>

        <!--Pantalla de registro de actividad-->
        <page-registro-actividad class="ion-page" id="pantalla-registro-actividad">
            <ion-header>
                <ion-toolbar color="warning">
                    <ion-buttons>
                        <ion-menu-button></ion-menu-button>
                    </ion-buttons>
                    <ion-title>Registro de actividad</ion-title>
                </ion-toolbar>
            </ion-header>
            <ion-content class="ion-padding">
                Registrar actividad
            </ion-content>
        </page-registro-actividad>



        <!--Pantalla de listadoactividades-->
        <page-actividades class="ion-page" id="pantalla-actividades">
            <ion-header>
                <ion-toolbar color="primary">
                    <ion-buttons>
                        <ion-menu-button></ion-menu-button>
                    </ion-buttons>
                    <ion-title>Actividades realizadas</ion-title>
                </ion-toolbar>
            </ion-header>
            <ion-content class="ion-padding">
                Lista de actividades
                <ul id="listaActividades"></ul>

            </ion-content>
        </page-actividades>
    </ion-app>






    <script type="text/javascript" src="js/clases.js"></script>
    <script type="text/javascript" src="js/miCodigo.js"></script>
</body>

</html>
